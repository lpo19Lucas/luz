<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FAF7F2; color: #1B2A4A; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 340px; }
  .icon { width: 64px; height: 64px; border-radius: 16px; background: #1B2A4A; color: #D4AF37; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; margin: 0 auto 16px; }
  button { margin-top: 20px; background: #D4AF37; color: #1B2A4A; border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">!</div>
    <h1 style="font-size:20px;margin:0 0 8px">Sem conexão com a internet</h1>
    <p style="margin:0;color:#7A8399">Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
